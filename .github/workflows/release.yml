name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          # full history and tags, the release notes list commits since the previous tag
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          notes=$(printf "## What's Changed\n%s" "$(git log --format='* %s' ${prev:+$prev..}$tag)")
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --notes "$notes" \
            --generate-notes \
            main.js manifest.json styles.css
